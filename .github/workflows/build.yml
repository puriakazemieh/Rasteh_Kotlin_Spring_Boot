name: Build Server

# Executes the production-relevant server gate, including PostgreSQL
# Testcontainers migration rehearsal, on pull requests and protected branches.
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run test and migration gate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace check
      - name: Build bootJar
        run: |
          ./gradlew --no-daemon --stacktrace bootJar
      - name: Collect jar
        if: always()
        run: |
          mkdir -p out
          cp "$(find build/libs -name '*.jar' ! -name '*-plain.jar' | head -1)" out/rasteh-server.jar 2>/dev/null || true
          ls -la out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rasteh-server-jar
          path: out/*.jar
          if-no-files-found: warn

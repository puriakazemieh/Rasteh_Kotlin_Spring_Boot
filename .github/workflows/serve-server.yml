name: Serve Server (live API)

# Runs the Spring Boot server live with a throwaway PostgreSQL and exposes its
# API on a free Cloudflare tunnel (a public URL). Use it to get a live backend
# you can point any client build at (e.g. the Build All workflow's base_url).
#
# Everything is temporary: it lives only while the job runs (the minutes you
# choose, max 350) and the URL changes every run. The URL is also pushed to the
# `claude/live-url` branch so you can read it the moment the tunnel is up.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to keep the API up (minutes, max 350)'
        type: string
        default: '90'
      seed_enabled:
        description: 'Seed demo data on the server'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rastehdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rastehdb" --health-interval=10s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build server jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bootJar
          cp "$(find build/libs -name '*.jar' ! -name '*-plain.jar' | head -1)" "$GITHUB_WORKSPACE/app.jar"

      - name: Start Cloudflare tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          grab() { for i in $(seq 1 40); do U=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$1" | head -1 || true); [ -n "$U" ] && { echo "$U"; return; }; sleep 2; done; }
          ./cloudflared tunnel --no-autoupdate --url http://localhost:8080 > api-tunnel.log 2>&1 &
          API_URL="$(grab api-tunnel.log)"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "api=$API_URL"

      - name: Start server (CORS allows any origin for testing)
        env:
          DATASOURCE_URL: jdbc:postgresql://localhost:5432/rastehdb
          DATASOURCE_USERNAME: postgres
          DATASOURCE_PASSWORD: postgres
          SERVER_PORT: '8080'
        run: |
          SEED="${{ inputs.seed_enabled }}"
          APP_CORS_ORIGINS="*" NGROK_URL="$API_URL" SEED_ENABLED="$SEED" \
            nohup java -jar app.jar > server.log 2>&1 &
          echo "waiting for server…"
          for i in $(seq 1 80); do
            if curl -sSf http://localhost:8080/api/rastehs >/dev/null 2>&1 || curl -sSf http://localhost:8080/ >/dev/null 2>&1; then echo "server up"; break; fi
            sleep 3
          done
          tail -40 server.log || true

      - name: Publish API URL to claude/live-url
        run: |
          {
            echo "run_id: ${GITHUB_RUN_ID}"
            echo "api_url: ${API_URL}/"
            echo "swagger: ${API_URL}/api/swagger-ui.html"
            echo "status: api-live"
            echo "updated: $(date -u +%FT%TZ)"
          } > live-url.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan live-url-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f live-url.txt
          git commit -q -m "api live (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/claude/live-url
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the API link
        run: |
          {
            echo "## Rasteh live API"
            echo ""
            echo "**API base:** ${API_URL}/"
            echo "**Swagger:** ${API_URL}/api/swagger-ui.html"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "API => ${API_URL}/"

      - name: Keep alive
        run: |
          MIN="${{ inputs.minutes }}"; MIN=${MIN:-90}
          if [ "$MIN" -gt 350 ]; then MIN=350; fi
          echo "staying up for ${MIN} minutes — API ${API_URL}"
          sleep "$((MIN*60))" || true

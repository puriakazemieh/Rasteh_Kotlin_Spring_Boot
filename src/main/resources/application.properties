spring.web.error.include-binding-errors=never
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
server.port=${SERVER_PORT:8080}
spring.application.name=rasteh

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:0}
spring.flyway.validate-migration-naming=true

management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
logging.pattern.level=%5p [requestId:%X{requestId:-}]

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:false}

springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

jwt.secret-key=${JWT_SECRET_KEY}
jwt.issuer=${JWT_ISSUER:rasteh}
jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:30}

zarinpal.merchant-id=${ZARINPAL_MERCHANT_ID:}
zarinpal.sandbox=${ZARINPAL_SANDBOX:false}
zarinpal.access-token=${ZARINPAL_ACCESS_TOKEN:}
zarinpal.callback-url=${ZARINPAL_CALLBACK_URL:}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:8081}
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:8081}
app.seed.enabled=${APP_SEED_ENABLED:false}
app.payment.enabled=${PAYMENT_ENABLED:false}
app.wallet.enabled=${WALLET_ENABLED:false}
app.web-session.cookie-domain=${WEB_SESSION_COOKIE_DOMAIN:}
app.web-session.secure=${WEB_SESSION_COOKIE_SECURE:false}
app.web-session.same-site=${WEB_SESSION_SAME_SITE:Strict}

sms.provider.url=${SMS_PROVIDER_URL:}
sms.provider.api-key=${SMS_PROVIDER_API_KEY:}
sms.provider.sender=${SMS_PROVIDER_SENDER:}

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}
